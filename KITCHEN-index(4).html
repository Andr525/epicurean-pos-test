<style>
:root {
  --bg: #0a0a0f;
  --surface: #14141f;
  --surface-2: #1e1e2e;
  --border: #2a2a3a;
  --primary: #B87333;
  --primary-light: #D4956A;
  --success: #4ade80;
  --warning: #fb923c;
  --danger: #ef4444;
  --info: #60a5fa;
  --text: #f1f5f9;
  --text-sec: #94a3b8;
  --text-muted: #64748b;
  --radius: 12px;
  --font: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body { font-family:var(--font); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }

.kds-app { display:flex; flex-direction:column; height:100vh; }

.kds-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.8rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0;
}
.kds-header h1 { font-size:1.1rem; font-weight:700; color:var(--primary-light); }
.kds-header .clock { font-family:var(--font-mono); font-size:1rem; color:var(--text-sec); }
.kds-header .order-count { font-size:0.8rem; color:var(--text-muted); }

.order-card.hold { border:2px dashed #facc15; background:rgba(250,204,21,.07); }
.hold-banner { background:#facc15; color:#422006; font-weight:800; font-size:.75rem; letter-spacing:.06em; padding:.3rem .6rem; text-align:center; }
.station-tabs {
  display:flex; gap:0; overflow-x:auto; background:var(--surface);
  border-bottom:1px solid var(--border); flex-shrink:0; scrollbar-width:none;
}
.station-tabs::-webkit-scrollbar { display:none; }
.station-tab {
  padding:0.6rem 1.2rem; font-size:0.75rem; font-weight:600; white-space:nowrap;
  color:var(--text-muted); border-bottom:2px solid transparent; cursor:pointer;
  text-transform:uppercase; letter-spacing:0.05em; transition:all 0.16s var(--ease);
}
.station-tab.active { color:var(--primary-light); border-bottom-color:var(--primary); }
.station-tab .tab-count {
  display:inline-block; background:var(--danger); color:#fff; font-size:0.6rem;
  width:16px; height:16px; border-radius:50%; text-align:center; line-height:16px;
  margin-left:0.3rem;
}

.kds-content { flex:1; overflow-y:auto; padding:1rem; }

.order-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; }

.order-card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; transition:all 0.2s var(--ease);
}
.order-card.urgent { border-color:var(--danger); }
.order-card .card-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.8rem 1rem; background:var(--surface-2); border-bottom:1px solid var(--border);
}
.order-card .table-badge {
  font-family:var(--font-mono); font-size:1.2rem; font-weight:700; color:var(--primary-light);
}
.order-card .server-name { font-size:0.75rem; color:var(--text-muted); }
.order-card .timer {
  font-family:var(--font-mono); font-size:0.9rem; font-weight:600;
  padding:0.2rem 0.6rem; border-radius:6px; background:rgba(74,222,128,0.1); color:var(--success);
}
.order-card .timer.warn { background:rgba(251,146,60,0.1); color:var(--warning); }
.order-card .timer.critical { background:rgba(239,68,68,0.1); color:var(--danger); animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:0.5} }

.order-card .card-items { padding:0.8rem 1rem; }
.order-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.5rem 0; border-bottom:1px solid var(--border);
}
.order-item:last-child { border-bottom:none; }
.order-item .item-name { font-size:0.85rem; font-weight:500; }
.order-item .item-mod { font-size:0.7rem; color:var(--warning); margin-top:0.1rem; }
.order-item .item-time { font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); }

.order-card .card-footer { padding:0.6rem 1rem; border-top:1px solid var(--border); }

/* Tasting/Prix Fixe course styling */
.order-card.tasting-course { border-color:var(--info); }
.order-card.tasting-course .card-header { background:rgba(96,165,250,0.08); }
.tasting-badge {
  display:inline-block; font-size:0.6rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.08em; padding:0.15rem 0.5rem; border-radius:4px;
  background:rgba(96,165,250,0.15); color:var(--info); margin-left:0.5rem;
}
.course-label {
  font-size:0.7rem; color:var(--info); font-weight:600; text-transform:uppercase;
  letter-spacing:0.05em; padding:0.3rem 1rem 0;
}
.pf-choices { font-size:0.7rem; color:var(--text-sec); padding:0 1rem 0.3rem; font-style:italic; }
.bump-btn {
  width:100%; padding:0.7rem; border:none; border-radius:8px;
  background:var(--success); color:var(--bg); font-size:0.85rem; font-weight:700;
  cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;
  transition:all 0.12s var(--ease);
}
.bump-btn:active { transform:scale(0.96); }

/* Empty state */
.empty-state { text-align:center; padding:4rem 2rem; color:var(--text-muted); }
.empty-state .icon { font-size:3rem; margin-bottom:1rem; opacity:0.5; }

/* Login overlay */
.login-overlay {
  position:fixed; inset:0; background:var(--bg); display:flex;
  align-items:center; justify-content:center; z-index:100; text-align:center;
}
.login-overlay h1 { font-size:1.5rem; margin-bottom:0.3rem; }
.login-overlay .sub { color:var(--primary-light); font-size:0.85rem; margin-bottom:2rem; }
.login-overlay .pin-row { display:flex; gap:8px; justify-content:center; margin-bottom:1.5rem; }
.login-overlay .pin-d { width:14px; height:14px; border-radius:50%; background:var(--border); transition:all 0.16s; }
.login-overlay .pin-d.on { background:var(--primary); box-shadow:0 0 8px rgba(184,115,51,0.5); }
.login-overlay .numgrid { display:grid; grid-template-columns:repeat(3,60px); gap:10px; justify-content:center; }
.login-overlay .nbtn {
  width:60px; height:60px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:1.3rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all 0.12s var(--ease);
}
.login-overlay .nbtn:active { transform:scale(0.9); background:var(--primary-glow); }
.login-overlay .nbtn.act { font-size:0.8rem; color:var(--text-sec); }
#kds-pin-error { color:var(--danger); font-size:0.8rem; margin-top:0.8rem; min-height:1.2rem; }

@media (max-width:480px) { .order-grid { grid-template-columns:1fr!important; } }

.order-card .table-badge{font-size:1.05rem!important}

.seat-chip{display:inline-block;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:0 .35rem;font-weight:800;font-size:.8rem;margin-right:.3rem}
.seat-chip.lady{background:#7c2d12;border-color:#fb923c;color:#ffedd5}
.stn-tag{font-size:.66rem;color:var(--text-muted);margin-left:.3rem}
.alg{color:#fb923c;font-weight:700}
/* ===== Light KDS (v. Nov4-a) ===== */
html,body{height:100%;overflow:hidden}
body{background:#f3f4f6;color:#111827;font-family:'Inter',-apple-system,sans-serif}
.login-overlay{background:#f3f4f6;color:#111827}
.login-overlay .nbtn{background:#fff;color:#111827;border-color:#d1d5db}
.login-overlay .pin-d{background:#d1d5db}
.kds-app{display:flex;flex-direction:column;height:100vh;background:#f3f4f6}
.kds-header{display:flex;align-items:center;gap:14px;padding:.55rem 1rem;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.kds-header h1{font-size:1.15rem;font-weight:800;color:#111827}
.kds-header .order-count{font-size:.8rem;color:#6b7280;margin-left:auto}
.kds-header .clock{font-size:1rem;font-weight:700;color:#111827;font-variant-numeric:tabular-nums}
.kds-content{flex:1;overflow:auto;padding:0 0 24px;-webkit-overflow-scrolling:touch}
.k-statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}
.k-group{display:flex;gap:6px}
.k-chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:7px 14px;font-size:.82rem;color:#374151;cursor:pointer;font-family:inherit}
.k-chip b{font-size:1rem;margin-right:3px}
.k-chip.on{background:#111827;color:#fff;border-color:#111827}
.k-chip.new b{color:#2563eb}.k-chip.prep b{color:#d97706}.k-chip.ready b{color:#16a34a}.k-chip.hold b{color:#a16207}
.k-chip.on b{color:#fff}
.k-stations{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid #e5e7eb}
.k-tab{border:0;background:#f3f4f6;border-radius:8px;padding:7px 13px;font-size:.82rem;font-weight:600;color:#4b5563;white-space:nowrap;cursor:pointer;font-family:inherit}
.k-tab i{font-style:normal;background:#111827;color:#fff;border-radius:9px;padding:0 6px;margin-left:4px;font-size:.7rem}
.k-tab.on{background:#111827;color:#fff}.k-tab.on i{background:#fff;color:#111827}
.k-tools{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap;align-items:center}
.k-search{border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:.85rem;width:150px;font-family:inherit}
.k-tool{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 11px;font-size:.78rem;color:#374151;cursor:pointer;font-family:inherit}
.k-tool.on{background:#dcfce7;border-color:#16a34a;color:#166534}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:4px 14px;align-items:start}
.k-ticket{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.k-bar{height:6px;background:#2563eb}.k-bar.preparing{background:#f59e0b}.k-bar.ready{background:#16a34a}.k-bar.hold{background:#eab308}
.k-ticket.ready{background:#f0fdf4;border-color:#86efac}
.k-ticket.hold{background:#fefce8;border-style:dashed;border-color:#facc15}
.k-head{display:flex;align-items:center;gap:8px;padding:9px 12px 4px;cursor:pointer}
.k-table{font-size:1.25rem;font-weight:800}
.k-meta{font-size:.75rem;color:#6b7280;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-state{font-size:.65rem;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:5px;background:#dbeafe;color:#1d4ed8}
.k-state.preparing{background:#fef3c7;color:#b45309}.k-state.ready{background:#bbf7d0;color:#166534}.k-state.hold{background:#fef08a;color:#854d0e}
.k-chev{color:#6b7280;font-size:1rem;width:18px;text-align:center}
.k-trow{display:flex;justify-content:space-between;gap:6px;padding:2px 12px 8px;font-size:.72rem;color:#6b7280;border-bottom:1px solid #f3f4f6}
.k-trow.warn{color:#b45309;font-weight:700}.k-trow.late{color:#dc2626;font-weight:800}
.k-summary{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px}

.k-secn{font-size:.68rem;color:#6b7280}
.k-sectag{margin-left:auto;font-size:.62rem;font-weight:800;padding:2px 6px;border-radius:4px;background:#dbeafe;color:#1d4ed8}
.k-sec.hold .k-sectag{background:#fef08a;color:#854d0e}.k-sec.working .k-sectag{background:#fef3c7;color:#b45309}.k-sec.done .k-sectag{background:#bbf7d0;color:#166534}
.k-sectimes{padding:0 12px 3px;font-size:.68rem;color:#6b7280}
.k-sec.done{background:#f0fdf4}

.k-item:active{background:#f3f4f6}

.k-seat.lady{background:#be185d}
.k-iname{flex:1;font-size:1rem;font-weight:600;line-height:1.25}
.k-size{margin-left:6px;font-size:.8rem;font-weight:700;color:#6b7280}
.k-mods{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.k-mod{font-size:.7rem;font-weight:700;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px}
.k-mod.bad{background:#fee2e2;color:#b91c1c}
.k-check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #d1d5db;font-size:.8rem;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.k-item.done .k-check{background:#16a34a;border-color:#16a34a}
.k-item.done{background:#f0fdf4}
.k-item.done .k-iname{text-decoration:line-through;color:#16a34a;font-weight:500}
.k-item.done .k-mods,.k-item.done .k-size{opacity:.5}
.k-item.hold{cursor:default;opacity:.75}
.k-holdtag{font-size:.6rem;font-weight:800;background:#fef08a;color:#854d0e;border-radius:4px;padding:2px 5px;margin-top:3px}
.k-note{margin:6px 12px;padding:6px 8px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:.82rem;font-weight:700}
.k-note.allergy{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.k-foot{display:flex;gap:8px;padding:8px 12px 10px;border-top:1px solid #f3f4f6}
.k-btn{flex:1;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:9px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;color:#374151}
.k-btn.bump{flex:2}.k-btn.go{background:#16a34a;color:#fff;border-color:#16a34a}

.k-hist{padding:6px 14px}.k-hist h3{font-size:.95rem;margin:8px 0}.k-hist small{font-weight:400;color:#6b7280}
.k-hrow{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:8px 12px;margin-bottom:8px}
.k-hhead{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.k-hsec{font-size:.8rem;margin:2px 0}.k-hit{display:inline-block;background:#f3f4f6;border-radius:5px;padding:1px 7px;margin:2px 3px 2px 0}
.k-empty-line{color:#9ca3af;padding:20px 0}

  body *{visibility:hidden}
  html,body{overflow:visible;height:auto}

}

    if(Object.prototype.hasOwnProperty.call(value,'booleanValue')) return value.booleanValue;
    if(Object.prototype.hasOwnProperty.call(value,'integerValue')) return Number(value.integerValue);
    if(Object.prototype.hasOwnProperty.call(value,'doubleValue')) return Number(value.doubleValue);
    if(Object.prototype.hasOwnProperty.call(value,'timestampValue')) return value.timestampValue;
    if(Object.prototype.hasOwnProperty.call(value,'bytesValue')) return value.bytesValue;
    if(Object.prototype.hasOwnProperty.call(value,'referenceValue')) return value.referenceValue;
    if(Object.prototype.hasOwnProperty.call(value,'geoPointValue')) return value.geoPointValue;

    }

  }
  function updateDoc(collection,id,data){
    var mask=fieldMaskQuery(data);

  }
  function addDoc(collection,data){
    var id='web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);
    return request('POST',FIRESTORE_ROOT+'/'+encodeURIComponent(collection)+'?documentId='+encodeURIComponent(id),{fields:encodeFields(data)}).then(function(json){return docFrom(json,id);});
  }
  function listDocs(collection){
    return request('GET',FIRESTORE_ROOT+'/'+encodeURIComponent(collection)+'?pageSize=1000').then(function(json){return (json.documents||[]).map(function(doc){return docFrom(doc);});});
  }

  }
  function watchCollection(collection,filter,callback,onError){

  }
  function collection(name){

}

// ─── Turning raw tickets into clean lines ───────────────────────
var TEMP_RE = /\s*[·\-]\s*(Rare|Medium Rare|Medium Well|Medium|Well Done|Well)\s*$/i;
function seatRank(seat){ var m=String(seat||'').match(/^(\d+)(A?)$/); if(!m) return 9999; return (m[2]?0:1000)+parseInt(m[1],10); }
function labelRank(l){
  var s=String(l||'').toLowerCase();
  if (/piccolo|welcome|amuse|bite/.test(s)) return 1;
  if (/appetizer|primi|starter|antipast/.test(s)) return 2;
  if (/main|piatti|entree|secondi/.test(s)) return 3;
  if (/pre-dessert|entremet/.test(s)) return 3.5;
  if (/dessert|dolce/.test(s)) return 4;
  return 5;
}
function labelFromCourse(n, name, station){
  n=Number(n);
  if (n===2) return 'Appetizer';
  if (n===3) return 'Main';
  if (n===4) return 'Dessert';
  if (normSt(station)==='pastry') return 'Dessert';
  return 'Kitchen';
}
function splitName(raw){
  var name=String(raw||'').trim(), mods=[];
  var t=name.match(TEMP_RE);
  if (t) { mods.push(t[1].toUpperCase()); name=name.replace(TEMP_RE,''); }
  var sz=name.match(/\s*\((appetizer size|main size|app size)\)\s*$/i);
  if (sz) { mods.push(sz[1].toUpperCase()); name=name.replace(/\s*\((appetizer size|main size|app size)\)\s*$/i,''); }
  var gf=name.match(/\s*\(GF pasta\)\s*$/i);
  if (gf) { mods.push('GLUTEN-FREE PASTA'); name=name.replace(/\s*\(GF pasta\)\s*$/i,''); }
  return { name:name.trim(), mods:mods };
}
function cleanMods(list){
  var out=[], seen={};
  (list||[]).forEach(function(m){
    String(m||'').split(' · ').forEach(function(part){
      part=part.trim();
      if (!part || /^extra plate$/i.test(part) || /^temp:/i.test(part)) return;
      var k=part.toLowerCase(); if (seen[k]) return; seen[k]=1; out.push(part);
    });
  });
  return out;
}
// Drinks: name + size only. No price, no description.
function drinkSize(mod){
  var m=String(mod||'');
  if (/taste|2\s*oz/i.test(m)) return '2 oz';
  if (/glass|6\s*oz/i.test(m)) return '6 oz';
  if (/bottle|750/i.test(m)) return 'Bottle';
  if (/half|375/i.test(m)) return 'Half';
  var c=m.replace(/^pour:\s*/i,'').replace(/\s*\$?\d+(\.\d+)?\s*$/,'').trim();
  return c;
}
function newItem(o, base){
  base.table=String(o.table); base.server=o.server||''; base.covers=o.guestCount||0;
  base.src=o.id; base.rank=labelRank(base.label);
  return base;
}
function normalize(orders){
  var items=[], notes=[], drinks=[];
  orders.slice().sort(function(a,b){ return (a.sentAt||0)-(b.sentAt||0) || String(a.id).localeCompare(String(b.id)); }).forEach(function(o){
    if (o.tastingCourse) {
      var tc=o.tastingCourse;
      if (isDrinkSt(tc.station)) return;
      var sp=splitName(tc.courseName);
      var mods=sp.mods.concat(cleanMods(tc.mods && tc.mods.length ? tc.mods : (tc.modNote?String(tc.modNote).split(' · '):[])));
      var label=tc.courseLabel || labelFromCourse(o.serviceCourse, tc.courseName, tc.station);
      items.push(newItem(o,{ seat:String(tc.position||o.position||'table'), name:sp.name, mods:mods, label:label, station:tc.station||'Expo', status:'fired', receivedAt:o.sentAt, firedAt:o.sentAt }));
      return;
    }
    if (o.isKitchenNote || o.allergyOverride) {
      (o.items||[]).forEach(function(i){
        notes.push({ table:String(o.table), seat:i.seat||'', text:[i.name&&i.name!=='NOTE'?i.name:'',i.notes||'',i.selectedMod||''].filter(Boolean).join(' — '), allergy:!!o.allergyOverride||/allerg/i.test(i.name||''), at:o.sentAt, src:o.id, station:i.station });
      });
      return;
    }
    (o.items||[]).forEach(function(i){
      if (isDrinkSt(i.station)) {
        drinks.push(newItem(o,{ seat:String(i.seat||'table'), name:splitName(i.name).name.split(/\s+[·|]\s+/)[0].replace(/\s*\$\d+(\.\d+)?\s*$/,''), size:drinkSize(i.selectedMod), mods:cleanMods([i.notes]), station:i.station, status:'fired', label:'Drinks', receivedAt:o.sentAt, firedAt:o.sentAt }));
        return;
      }
      var sp=splitName(i.name);
      var base={ seat:String(i.seat||'table'), name:sp.name, mods:sp.mods.concat(cleanMods([i.selectedMod,i.notes])), station:i.station||'Expo' };
      if (o.overview || i.preview) {
        base.label=i.courseLabel || labelFromCourse(i.course, i.name, i.station);
        base.status='hold'; base.receivedAt=o.sentAt; base.firedAt=null;
        if (i.mods && i.mods.length) base.mods=sp.mods.concat(cleanMods(i.mods));
      } else {
        base.label=i.courseLabel || labelFromCourse(i.course||i.serviceCourse, i.name, i.station);
        base.status='fired'; base.receivedAt=o.sentAt; base.firedAt=o.sentAt;
      }
      items.push(newItem(o,base));
    });
  });
  // key every line; a fired line replaces the matching on-hold preview of the same dish
  var occ={}, byKey={}, out=[];
  items.forEach(function(it){
    var k=it.table+'|'+it.seat+'|'+it.name.toLowerCase();
    var holdKey=k+'|hold', pos;
    if (it.status==='fired' && byKey[holdKey] && byKey[holdKey].length) {
      var prev=byKey[holdKey].shift();
      it.receivedAt=Math.min(prev.receivedAt||it.receivedAt, it.receivedAt);
      it.label=it.label||prev.label; it.rank=labelRank(it.label);
      out[out.indexOf(prev)]=it; it.key=prev.key; return;
    }

    it.key=k+'#'+occ[k];
    if (it.status==='hold') (byKey[holdKey]=byKey[holdKey]||[]).push(it);
    out.push(it);
  });

  var occD={};
  drinks.forEach(function(it){ var k=it.table+'|'+it.seat+'|'+it.name.toLowerCase()+'|'+it.size; occD[k]=(occD[k]||0)+1; it.key='d|'+k+'#'+occD[k]; it.doneAt=DONE[it.key]||null; });
  return { items:out, notes:notes, drinks:drinks };
}

// ─── Build tickets (one per table) ──────────────────────────────
function buildTickets(){
  var n=normalize(STATE.orders);
  var pool = SCREEN==='kitchen' ? n.items : n.drinks.filter(function(d){ return normSt(d.station)===SCREEN; });
  RECALL.forEach(function(t){ t.items.forEach(function(it){ it.doneAt=DONE[it.key]||null; }); pool=pool.concat(t.items); });
  var tables={};
  pool.forEach(function(it){
    var closed=CLOSED[it.table];
    if (closed && (it.firedAt||it.receivedAt||0)<=closed && !it.recalled) return;
    var t=tables[it.table]||(tables[it.table]={ table:it.table, server:it.server, covers:it.covers, items:[], notes:[] });
    if (!t.server) t.server=it.server; if (!t.covers) t.covers=it.covers;
    t.items.push(it);
  });
  n.notes.forEach(function(nt){
    if (SCREEN==='kitchen' ? isDrinkSt(nt.station) : normSt(nt.station)!==SCREEN) return;
    var t=tables[nt.table]; if (!t) return;
    var closed=CLOSED[nt.table]; if (closed && nt.at<=closed) return;
    t.notes.push(nt);
  });
  var list=Object.keys(tables).map(function(k){ return decorate(tables[k]); });
  return list;
}
function decorate(t){
  var secs={};
  t.items.forEach(function(it){
    var key=it.label||'Kitchen';
    var s=secs[key]||(secs[key]={ label:key, rank:it.rank||labelRank(key), items:[], receivedAt:null, firedAt:null, outAt:null });
    s.items.push(it);
  });
  t.sections=Object.keys(secs).map(function(k){ return secs[k]; }).sort(function(a,b){ return a.rank-b.rank; });
  var stationOnly=SCREEN==='kitchen' && STATE.station!=='All';
  t.sections.forEach(function(s){
    s.items.sort(function(a,b){ return seatRank(a.seat)-seatRank(b.seat) || a.name.localeCompare(b.name); });
    var fired=s.items.filter(function(i){ return i.status==='fired'; });
    s.receivedAt=Math.min.apply(null,s.items.map(function(i){ return i.receivedAt||Infinity; }));
    s.firedAt=fired.length?Math.min.apply(null,fired.map(function(i){ return i.firedAt||Infinity; })):null;
    s.allDone=fired.length>0 && fired.length===s.items.length && fired.every(function(i){ return i.doneAt; });
    s.state= fired.length===0 ? 'hold' : (s.allDone ? 'done' : (fired.some(function(i){ return i.doneAt; }) ? 'working' : 'fired'));
    s.outAt=s.allDone ? Math.max.apply(null,fired.map(function(i){ return i.doneAt; })) : null;
  });
  var all=t.items;
  var fired=all.filter(function(i){ return i.status==='fired'; });
  var doneN=fired.filter(function(i){ return i.doneAt; }).length;
  t.firedN=fired.length; t.doneN=doneN; t.holdN=all.length-fired.length;
  t.status = fired.length===0 ? 'hold' : (doneN===fired.length ? 'ready' : (doneN>0 ? 'preparing' : 'new'));
  t.receivedAt=Math.min.apply(null,all.map(function(i){ return i.receivedAt||Infinity; }));
  t.activeAt=Math.max.apply(null,all.map(function(i){ return Math.max(i.firedAt||0,i.receivedAt||0,i.doneAt||0); }));
  t.oldestOpen=fired.filter(function(i){ return !i.doneAt; }).reduce(function(m,i){ return Math.min(m,i.firedAt||m); }, Infinity);
  return t;
}
function visibleTicket(t){
  // station filter (kitchen only): keep only lines of that station
  if (SCREEN==='kitchen' && STATE.station!=='All') {
    var keep=t.items.filter(function(i){ return normSt(i.station)===normSt(STATE.station); });
    if (STATE.station==='Expo') keep=t.items;
    if (!keep.length) return null;
    var c=Object.assign({},t,{ items:keep }); return decorate(c);
  }
  return t;
}

  var body='';
  if (collapsed) {
    body='<div class="k-summary">'+t.sections.map(function(s){ return '<span class="k-pill '+s.state+'">'+esc(s.label)+' '+{hold:'hold',fired:'●',working:'◐',done:'✓'}[s.state]+'</span>'; }).join('')+'</div>';
  } else {
    body=notes+t.sections.map(function(s){ return sectionHtml(t,s); }).join('');
  }
  var armed=STATE.armed===id;
  var foot='<div class="k-foot"><button class="k-btn ghost" onclick="printTicket(\''+id+'\')">Print</button>'+
    '<button class="k-btn bump'+(t.status==='ready'?' go':'')+'" onclick="bump(\''+id+'\')">'+(t.status==='ready'?'Clear ✓':(armed?'Tap again to clear':'Clear'))+'</button></div>';
  return '<div class="k-ticket '+t.status+(collapsed?' collapsed':'')+'" data-t="'+esc(id)+'">'+head+timeRow+body+foot+'</div>';
}
var allTickets=[];
function render(){
  var tickets=buildTickets();
  // very old tickets go to Completed on their own (nothing is lost; recall from there)
  var now=Date.now(), stale=tickets.filter(function(t){ return now-t.activeAt>STALE_HOURS*3600000; });
  if (stale.length) { stale.forEach(function(t){ archive(t,'auto'); }); tickets=buildTickets(); }
  allTickets=tickets;
  var vis=tickets.map(visibleTicket).filter(Boolean);
  var top=renderTop(vis);
  var h=top;
  if (STATE.view==='history') { $('kds-content').innerHTML=h+historyHtml(); updateCount(vis); return; }
  var list=vis.filter(function(t){ return STATE.filter==='all' || t.status===STATE.filter; });
  if (STATE.search) list=list.filter(function(t){ return ('t'+t.table).toLowerCase().indexOf(STATE.search.toLowerCase())>=0 || String(t.table).indexOf(STATE.search)>=0; });
  list.sort(function(a,b){ return (a.status==='ready')-(b.status==='ready') || a.receivedAt-b.receivedAt; });
  h+= list.length ? '<div class="k-grid">'+list.map(ticketHtml).join('')+'</div>' : '<div class="k-empty"><div>✓</div><p>All clear — no open orders</p></div>';
  var keep=$('k-search')&&document.activeElement===$('k-search');
  $('kds-content').innerHTML=h;
  if (keep) { var e=$('k-search'); e.focus(); try{ e.setSelectionRange(e.value.length,e.value.length); }catch(x){} }
  updateCount(vis);
  maybeAutoPrint(tickets);
  bindSwipe();
}
function updateCount(vis){
  var c=statusCounts(vis);
  $('kds-order-count').textContent=c.all+' open · '+c.ready+' ready';
}
function historyHtml(){
  var q=STATE.search.toLowerCase();
  var rows=HIST.filter(function(h){ return !q || ('t'+h.table).toLowerCase().indexOf(q)>=0; }).map(function(h,i){
    var secs={}; h.items.forEach(function(it){ (secs[it.label]=secs[it.label]||[]).push(it); });
    var body=Object.keys(secs).sort(function(a,b){ return labelRank(a)-labelRank(b); }).map(function(l){
      return '<div class="k-hsec"><b>'+esc(l)+'</b> '+secs[l].map(function(it){ return '<span class="k-hit">'+esc(it.seat==='table'?'':it.seat+' ')+esc(it.name)+(it.size?' '+esc(it.size):'')+(it.doneAt?'':' <em>(not marked out)</em>')+'</span>'; }).join('')+'</div>';
    }).join('');
    return '<div class="k-hrow"><div class="k-hhead"><span class="k-table">T'+esc(h.table)+'</span><span class="k-meta">'+esc(h.server||'')+' · closed '+clock12(h.closedAt)+' · '+new Date(h.closedAt).toLocaleDateString()+(h.how==='auto'?' · auto-archived':'')+'</span><button class="k-btn ghost sm" onclick="recall('+HIST.indexOf(h)+')">Bring back</button></div>'+body+'</div>';
  }).join('');
  return '<div class="k-hist"><h3>Completed orders <small>(last '+HISTORY_DAYS+' days, kept on this screen)</small></h3>'+(rows||'<p class="k-empty-line">Nothing completed yet.</p>')+'</div>';
}

// ─── Actions ────────────────────────────────────────────────────
function setFilter(f){ STATE.filter=f; STATE.view='live'; render(); }
function setView(v){ STATE.view=v; render(); }
function setStation(s){ STATE.station=s; STATE.view='live'; render(); }
function setSearch(v){ STATE.search=v; render(); }
function toggleDone(key){
  if (DONE[key]) delete DONE[key]; else DONE[key]=Date.now();
  saveAll(); render();
}
function toggleCollapse(id){
  var t=allTickets.filter(function(x){ return x.table===id; })[0];
  var cur=STATE.collapsed[id]!==undefined?STATE.collapsed[id]:(t&&t.status==='ready');
  STATE.collapsed[id]=!cur; render();
}
function collapseAll(flag){ allTickets.forEach(function(t){ STATE.collapsed[t.table]=flag; }); render(); }
function archive(t, how){
  var snap={ table:t.table, server:t.server, covers:t.covers, closedAt:Date.now(), how:how||'bump',
    items:t.items.map(function(i){ return { key:i.key, seat:i.seat, name:i.name, mods:i.mods, size:i.size, label:i.label, station:i.station, status:i.status, receivedAt:i.receivedAt, firedAt:i.firedAt, doneAt:i.doneAt||DONE[i.key]||null, table:i.table, server:i.server, covers:i.covers, rank:i.rank, recalled:true } }) };
  HIST.unshift(snap);
  var cutoff=Date.now()-HISTORY_DAYS*86400000;
  HIST=HIST.filter(function(h){ return h.closedAt>cutoff; }).slice(0,400);
  CLOSED[t.table]=Date.now();
  RECALL=RECALL.filter(function(r){ return r.table!==t.table; });
  // take the tickets off the shared feed so other screens stop showing them
  var ids={}; STATE.orders.forEach(function(o){ if (String(o.table)===String(t.table)) ids[o.id]=1; });
  if (SCREEN==='kitchen') Object.keys(ids).forEach(function(id){ removeActiveOrder(id); });
  saveAll();
}
function bump(id){
  var t=allTickets.filter(function(x){ return x.table===id; })[0];
  if (!t) return;
  if (t.status!=='ready' && STATE.armed!==id) { STATE.armed=id; render(); setTimeout(function(){ if (STATE.armed===id) { STATE.armed=null; render(); } },4000); return; }
  STATE.armed=null;
  archive(t,'bump');
  if (SCREEN==='kitchen') { STATE.orders=STATE.orders.filter(function(o){ return String(o.table)!==String(id); }); }
  render();
}
function recall(i){
  var h=HIST[i]; if (!h) return;
  HIST.splice(i,1);
  h.items.forEach(function(it){ delete DONE[it.key]; it.doneAt=null; it.recalled=true; });
  delete CLOSED[h.table];
  RECALL.push({ table:h.table, items:h.items });
  STATE.view='live'; saveAll(); render();
}
function removeActiveOrder(orderId) {
  if (!fbReady) return;
  var feedRef=fbDb.collection('boh_shared').doc('active_orders');
  feedRef.get().then(function(doc){
    if (!doc.exists) return;
    var data=doc.data()||{};
    var list=Array.isArray(data.list) ? data.list.filter(function(order){ return order && order.id !== orderId; }) : [];
    return feedRef.set({list:list,updatedAt:Date.now()});
  }).catch(function(error){ console.error('Active order feed update failed', error); });
}
var swipeX=null;
function bindSwipe(){
  document.querySelectorAll('.k-ticket.ready').forEach(function(el){
    el.ontouchstart=function(e){ swipeX=e.touches[0].clientX; };
    el.ontouchend=function(e){ if (swipeX==null) return; var dx=e.changedTouches[0].clientX-swipeX; swipeX=null; if (Math.abs(dx)>140) bump(el.getAttribute('data-t')); };
  });
}

// ─── Printing (home printer now; ticket printer later) ──────────
function ticketText(t, onlySection){
  var L=[]; L.push(SCREEN_TITLE.toUpperCase()+' · TABLE '+t.table+(t.server?' · '+t.server:'')+(t.covers?' · '+t.covers+' covers':''));
  L.push('Printed '+clock12(Date.now()));
  t.notes.forEach(function(n){ L.push((n.allergy?'!! ':'** ')+(n.seat?n.seat+': ':'')+n.text); });
  t.sections.forEach(function(s){
    if (onlySection && s.label!==onlySection) return;
    L.push(''); L.push(s.label.toUpperCase()+(s.firedAt?'  (fired '+clock12(s.firedAt)+')':'  (on hold)'));
    s.items.forEach(function(it){ L.push(' ['+(it.seat==='table'?'T':it.seat)+'] '+it.name+(it.size?' '+it.size:'')+(it.mods&&it.mods.length?'  -- '+it.mods.join(', '):'')); });
  });
  return L.join('\n');
}
function printText(text){
  var el=$('print-area'); el.textContent=text;
  window.print();
}
function printTicket(id){
  var t=allTickets.filter(function(x){ return x.table===id; })[0]; if (!t) return;
  printText(ticketText(t));
}
function toggleAutoPrint(){ AUTOPRINT=!AUTOPRINT; lsSet('kds_autoprint_'+P,AUTOPRINT); render(); }
function maybeAutoPrint(tickets){
  if (!AUTOPRINT) { tickets.forEach(function(t){ t.items.forEach(function(i){ if (i.status==='fired') PRINTED[i.key]=1; }); }); lsSet('kds_printed_'+P,PRINTED); return; }
  var out=[];
  tickets.forEach(function(t){
    var fresh={};
    t.items.forEach(function(i){ if (i.status==='fired' && !PRINTED[i.key]) { PRINTED[i.key]=1; fresh[i.label]=1; } });
    Object.keys(fresh).forEach(function(l){ out.push(ticketText(t,l)); });
  });
  lsSet('kds_printed_'+P,PRINTED);
  if (out.length) printText(out.join('\n\n--------------------------------\n\n'));
}

// ─── Login ──────────────────────────────────────────────────────
var kdsPin='';
function buildKdsNumpad() {
  var pad=document.getElementById('kds-numpad');
  [1,2,3,4,5,6,7,8,9,'⌫',0,'→'].forEach(function(k){
    var btn=document.createElement('button');
    btn.className='nbtn'+(typeof k==='string'?' act':'');
    btn.textContent=k;
    btn.onclick=function(){ kdsKey(k); };
    pad.appendChild(btn);
  });
}
function kdsKey(k) {
  if (k==='⌫') kdsPin=kdsPin.slice(0,-1);
  else if (k==='→') kdsAttempt();
  else if (kdsPin.length<20) kdsPin+=k;
  document.querySelectorAll('#kds-pin-dots .pin-d').forEach(function(d,i){ d.classList.toggle('on',i<Math.min(kdsPin.length,4)); });
  if (kdsPin.length===4) setTimeout(kdsAttempt,200);
}
function kdsAttempt() {
  if (KITCHEN_CODES.indexOf(kdsPin)>=0) {
    document.getElementById('kds-login').style.display='none';
    document.getElementById('kds-app').style.display='flex';
    startKDS();
  } else {
    document.getElementById('kds-pin-error').textContent='Invalid code';
    kdsPin='';
    document.querySelectorAll('#kds-pin-dots .pin-d').forEach(function(d){ d.classList.remove('on'); });
  }
}

// ─── Live feed ──────────────────────────────────────────────────
function startKDS() {
  document.title=SCREEN_TITLE+' Display';
  $('kds-title').textContent=SCREEN_TITLE;
  document.body.classList.add('screen-'+SCREEN);
  loadOrders();
  setInterval(updateClock,1000); updateClock();
  setInterval(function(){ if (document.activeElement!==$('k-search')) render(); },30000);
}
function loadOrders() {
  if (!fbReady) { render(); return; }
  fbDb.collection('boh_shared').doc('active_orders').onSnapshot(function(doc){
    var list = doc.exists && doc.data() && Array.isArray(doc.data().list) ? doc.data().list : [];
    STATE.orders = list.filter(function(order){ return order && order.status === 'new'; });
    render();
  }, function(error){
    console.error('Active order feed read failed', error);
    STATE.orders=[]; render();
  });
}
function updateClock() {
  var now=new Date();
  $('kds-clock').textContent=clock12(now.getTime());
}

// ─── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){ buildKdsNumpad(); var t=document.getElementById('kds-login-title'); if(t) t.textContent=SCREEN_TITLE+' Display'; var sb=document.getElementById('kds-login-sub'); if(sb) sb.textContent='Enter '+SCREEN_TITLE.toLowerCase()+' code'; document.title=SCREEN_TITLE+' Display'; });

</script>
